name: CI

on:
    push:
    pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download code
        uses: actions/checkout@v4
      - name: Java Setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run tests
        run: mvn --batch-mode verify
      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Dockerfile
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:$GITHUB_SHA" .
      - name: Publish Dockerfile
        if: github.event_name == 'push'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Download deployment repository
        if: github.event_name == 'push' && github.ref == 'ref/heads/master'
        uses: actions/checkout@v4
        with:
          repository: breimato/library-deploy
          token: '${{ secrets.DEPLOY_REPO_TOKEN }}'
          path: deployment
      - name: Update deployment image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: deployment
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"

          sed -i "s|^\([[:space:]]*image:\).*|\1 $IMAGE|" k8s/library-deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/library-deployment.yaml

          if git diff --cached --quiet; then
            echo "La imagen ya está actualizada"
          else
            git commit -m "Deploy Library $GITHUB_SHA"
            git push
          fi
