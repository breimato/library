get:
  summary: "Get Loan Requests V1"
  description: "Get all loan requests"
  operationId: "GetLoanRequestsV1"
  tags:
    - get-loan-requests-v1
  parameters:
    - name: id
      in: query
      required: false
      description: "Filter by identifier"
      schema:
        type: integer
        format: int32
    - name: userId
      in: query
      required: false
      description: "Filter by user identifier"
      schema:
        type: integer
        format: int32
    - name: bookId
      in: query
      required: false
      description: "Filter by book identifier"
      schema:
        type: integer
        format: int32
    - name: status
      in: query
      required: false
      description: "Filter by status"
      schema:
        type: integer
        format: int32
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/GetLoanRequestsV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
post:
  summary: "Post Loan Request V1"
  description: "Create a new loan request"
  operationId: "PostLoanRequestV1"
  tags:
    - post-loan-request-v1
  parameters:
    - name: X-Requester-Id
      in: header
      required: true
      schema:
        type: integer
        format: int32
      description: "Identifier of the user performing the action"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/PostLoanRequestV1Request.yaml'
  responses:
    '201':
      description: "201 Created"
      content:
        application/json:
          schema:
            $ref: '../responses/LoanRequestV1Response.yaml'
    '404':
      description: "Not Found - User or book not found"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
