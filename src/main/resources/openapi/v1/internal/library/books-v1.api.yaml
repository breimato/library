get:
  summary: "Get Books V1"
  description: "Get all books, optionally filtered by search criteria"
  operationId: "GetBooksV1"
  tags:
    - get-books-v1
  parameters:
    - name: id
      in: query
      required: false
      description: "Filter by identifier"
      schema:
        type: integer
        format: int32
    - name: isbn
      in: query
      required: false
      description: "Filter by ISBN"
      schema:
        type: string
    - name: title
      in: query
      required: false
      description: "Filter by title"
      schema:
        type: string
    - name: author
      in: query
      required: false
      description: "Filter by author"
      schema:
        type: string
    - name: genre
      in: query
      required: false
      description: "Filter by genre"
      schema:
        type: string
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/GetBooksV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
post:
  summary: "Post Book V1"
  description: "Create a new book"
  operationId: "PostBookV1"
  tags:
    - post-book-v1
  parameters:
    - name: X-Requester-Id
      in: header
      required: true
      schema:
        type: integer
        format: int32
      description: "Identifier of the user performing the action"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/PostBookV1Request.yaml'
  responses:
    '201':
      description: "201 Created"
      content:
        application/json:
          schema:
            $ref: '../responses/BookV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
