get:
  summary: "Get Reservations V1"
  description: "Get all reservations"
  operationId: "GetReservationsV1"
  tags:
    - get-reservations-v1
  parameters:
    - name: id
      in: query
      required: false
      description: "Filter by identifier"
      schema:
        type: integer
        format: int32
    - name: userId
      in: query
      required: false
      description: "Filter by user identifier"
      schema:
        type: integer
        format: int32
    - name: bookId
      in: query
      required: false
      description: "Filter by book identifier"
      schema:
        type: integer
        format: int32
    - name: loanId
      in: query
      required: false
      description: "Filter by loan identifier"
      schema:
        type: integer
        format: int32
    - name: status
      in: query
      required: false
      description: "Filter by status"
      schema:
        type: integer
        format: int32
  responses:
    '200':
      description: "200 OK"
      content:
        application/json:
          schema:
            $ref: '../responses/GetReservationsV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
post:
  summary: "Post Reservation V1"
  description: "Create a new reservation"
  operationId: "PostReservationV1"
  tags:
    - post-reservation-v1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../requests/PostReservationV1Request.yaml'
  responses:
    '201':
      description: "201 Created"
      content:
        application/json:
          schema:
            $ref: '../responses/ReservationV1Response.yaml'
    '500':
      description: "Internal Server Error"
      content:
        application/json:
          schema:
            $ref: '../components/ApiErrorV1.yaml'
